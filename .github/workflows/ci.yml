name: Backend verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]' ruff
      - name: Lint and unit tests
        run: |
          ruff check src scripts tests
          python -m pytest -q
          python -m pip check
      - name: Portable proof and attack fixtures
        run: |
          trust404 demo --out "$RUNNER_TEMP/trust404-demo"
          python scripts/attack_report.py --demo-dir "$RUNNER_TEMP/trust404-demo"
      - name: Operator and witness integration
        run: |
          python scripts/prepare_compose.py --project-root .
          docker compose up --build --wait -d
          python scripts/compose_smoke.py --project-root .
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: Stop containers
        if: always()
        run: docker compose down -v || true
